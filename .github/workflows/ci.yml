name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # `--no-renames` and the absence of a --diff-filter are load-bearing: a
      # deletion, or a rename that lands on a documentation path, must still
      # count the source path it came from, or removing code would buy a PR a
      # skipped test suite.
      - name: Detect what changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only --no-renames "$BASE_SHA...HEAD" > changed-files.txt
          git -c core.quotePath=false diff --name-only --diff-filter=d "$BASE_SHA...HEAD" > present-files.txt
          docs_only=true
          if [ ! -s changed-files.txt ]; then
            docs_only=false
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Any Markdown a test reads (prompt fixtures, for one) has to come
            # out of this pattern, or the tests that validate it stop running
            # on the very pull request that changes it.
            case "$file" in
              *.md) ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < changed-files.txt
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only ($(wc -l < changed-files.txt) changed paths)"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build

      - name: Drizzle check
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm --filter @feudo/web exec drizzle-kit check

      - name: Impeccable detect
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          grep -E '^apps/web/src/.*\.(tsx|css)$' present-files.txt > impeccable-files.txt || true
          if [ ! -s impeccable-files.txt ]; then
            echo "No changed .tsx/.css files under apps/web/src; skipping Impeccable detect."
            exit 0
          fi
          xargs -r -d '\n' npx --yes impeccable detect < impeccable-files.txt

  integration:
    runs-on: ubuntu-latest
    needs: ci
    if: needs.ci.outputs.docs_only != 'true'
    concurrency:
      group: preview-db
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset the preview project's schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @feudo/web db:reset-schema

      - name: Migrate the preview project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
        run: pnpm --filter @feudo/web db:migrate

      - name: Integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm test:integration

  # Not yet a required check; promote once it has proven stable across a few PRs.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Vercel Preview deployments share the same `feudo-preview` database across
    # every branch's CI run. This job resets and migrates that schema itself,
    # inside its own held `preview-db` concurrency slot, so a concurrent
    # branch's `integration` job cannot wipe the schema mid-run.
    # Runs after `integration` so the two preview-db jobs of one run are never both pending in the shared `preview-db` concurrency group, where GitHub would cancel the older pending job for a newer one.
    needs: [ci, integration]
    if: needs.ci.outputs.docs_only != 'true'
    timeout-minutes: 20
    concurrency:
      group: preview-db
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset the preview project's schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @feudo/web db:reset-schema

      - name: Migrate the preview project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
        run: pnpm --filter @feudo/web db:migrate

      - name: Install Playwright Chromium
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome*.sources
          attempt=0
          max_attempts=5
          until pnpm --filter @feudo/web exec playwright install --with-deps chromium; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "playwright install --with-deps failed after $max_attempts attempts."
              exit 1
            fi
            echo "playwright install --with-deps failed (attempt $attempt/$max_attempts), retrying in 15s."
            sleep 15
          done

      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          attempt=0
          max_attempts=60
          url=""
          while [ "$attempt" -lt "$max_attempts" ]; do
            deployments=$(gh api "repos/$REPO/deployments?sha=$SHA" 2>/dev/null || echo "[]")
            deployment_id=$(echo "$deployments" | jq -r '[.[] | select(.environment=="Preview")] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(gh api "repos/$REPO/deployments/$deployment_id/statuses" 2>/dev/null || echo "[]")
              url=$(echo "$statuses" | jq -r '[.[] | select(.state=="success")] | sort_by(.created_at) | last | .environment_url // empty')
              if [ -n "$url" ]; then
                break
              fi
              failed=$(echo "$statuses" | jq -r '[.[] | select(.state=="failure" or .state=="error")] | length')
              if [ "$failed" -gt 0 ]; then
                echo "The Vercel deployment for this PR failed."
                exit 1
              fi
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          if [ -z "$url" ]; then
            echo "Timed out waiting for the Vercel preview deployment to become ready."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run Playwright e2e tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_ONLY_TOKEN: ${{ secrets.TEST_ONLY_TOKEN }}
        run: pnpm --filter @feudo/web exec playwright test

      - name: Upload Playwright screenshots and report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/test-results/**/*.png
            apps/web/playwright-report
          retention-days: 7
