name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Drizzle check
        run: pnpm --filter @feudo/web exec drizzle-kit check

      - name: Impeccable detect
        run: |
          set -e
          git fetch origin main --depth=1 || true
          CHANGED=$(git diff --name-only --diff-filter=d origin/main...HEAD -- 'apps/web/src/**/*.tsx' 'apps/web/src/**/*.css' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed .tsx/.css files under apps/web/src; skipping Impeccable detect."
            exit 0
          fi
          echo "$CHANGED"
          npx --yes impeccable detect $CHANGED

  integration:
    runs-on: ubuntu-latest
    needs: ci
    concurrency:
      group: preview-db
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset the preview project's schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @feudo/web db:reset-schema

      - name: Migrate the preview project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @feudo/web db:migrate

      - name: Integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm test:integration

  migrate-production:
    name: migrate-production
    runs-on: ubuntu-latest
    needs: [ci, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-db
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard the production database host
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: |
          node -e '
            const normalise = (host) => host.toLowerCase().replace(/\.$/, "").replace(/^([^.]+)-pooler(\.|$)/, "$1$2");
            let actual;
            try {
              actual = normalise(new URL(process.env.DATABASE_URL ?? "").hostname);
            } catch {
              console.error("FAIL");
              process.exit(1);
            }
            const expected = process.env.DATABASE_PRODUCTION_HOST ? normalise(process.env.DATABASE_PRODUCTION_HOST) : "";
            if (!expected || actual !== expected) {
              console.error("FAIL");
              process.exit(1);
            }
            console.log("PASS");
          '

      - name: Migrate production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @feudo/web db:migrate

  # Not yet a required check; promote once it has proven stable across a few PRs.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Vercel Preview deployments share the same `feudo-preview` database across
    # every branch's CI run. This job resets and migrates that schema itself,
    # inside its own held `preview-db` concurrency slot, so a concurrent
    # branch's `integration` job cannot wipe the schema mid-run.
    # Runs after `integration` so the two preview-db jobs of one run are never both pending in the shared `preview-db` concurrency group, where GitHub would cancel the older pending job for a newer one.
    needs: [ci, integration]
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    concurrency:
      group: preview-db
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset the preview project's schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @feudo/web db:reset-schema

      - name: Migrate the preview project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @feudo/web db:migrate

      - name: Install Playwright Chromium
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome*.sources
          attempt=0
          max_attempts=5
          until pnpm --filter @feudo/web exec playwright install --with-deps chromium; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "playwright install --with-deps failed after $max_attempts attempts."
              exit 1
            fi
            echo "playwright install --with-deps failed (attempt $attempt/$max_attempts), retrying in 15s."
            sleep 15
          done

      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          attempt=0
          max_attempts=60
          url=""
          while [ "$attempt" -lt "$max_attempts" ]; do
            deployments=$(gh api "repos/$REPO/deployments?sha=$SHA" 2>/dev/null || echo "[]")
            deployment_id=$(echo "$deployments" | jq -r '[.[] | select(.environment=="Preview")] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(gh api "repos/$REPO/deployments/$deployment_id/statuses" 2>/dev/null || echo "[]")
              url=$(echo "$statuses" | jq -r '[.[] | select(.state=="success")] | sort_by(.created_at) | last | .environment_url // empty')
              if [ -n "$url" ]; then
                break
              fi
              failed=$(echo "$statuses" | jq -r '[.[] | select(.state=="failure" or .state=="error")] | length')
              if [ "$failed" -gt 0 ]; then
                echo "The Vercel deployment for this PR failed."
                exit 1
              fi
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          if [ -z "$url" ]; then
            echo "Timed out waiting for the Vercel preview deployment to become ready."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run Playwright e2e tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_ONLY_TOKEN: ${{ secrets.TEST_ONLY_TOKEN }}
        run: pnpm --filter @feudo/web exec playwright test

      - name: Upload Playwright screenshots and report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/test-results/**/*.png
            apps/web/playwright-report
          retention-days: 7
