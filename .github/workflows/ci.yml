name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Drizzle check
        run: pnpm --filter @feudo/web exec drizzle-kit check

      - name: Impeccable detect
        run: |
          set -e
          git fetch origin main --depth=1 || true
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'apps/web/src/**/*.tsx' 'apps/web/src/**/*.css' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed .tsx/.css files under apps/web/src; skipping Impeccable detect."
            exit 0
          fi
          echo "$CHANGED"
          npx --yes impeccable detect $CHANGED

  integration:
    runs-on: ubuntu-latest
    needs: ci
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check preview database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_PREVIEW secret is not set; skipping the integration job until the owner adds it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate the shared preview branch
        if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @feudo/web db:migrate

      - name: Reset preview data
        if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @feudo/web db:reset

      - name: Integration tests
        if: steps.check.outputs.ready == 'true'
        run: pnpm test:integration

  reset-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Reset the preview branch from main
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node apps/web/scripts/reset-neon-preview.mjs
