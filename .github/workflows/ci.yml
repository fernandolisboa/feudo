name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Drizzle check
        run: pnpm --filter @feudo/web exec drizzle-kit check

      - name: Impeccable detect
        run: |
          set -e
          git fetch origin main --depth=1 || true
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'apps/web/src/**/*.tsx' 'apps/web/src/**/*.css' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed .tsx/.css files under apps/web/src; skipping Impeccable detect."
            exit 0
          fi
          echo "$CHANGED"
          npx --yes impeccable detect $CHANGED

  integration:
    runs-on: ubuntu-latest
    needs: ci
    concurrency:
      group: preview-db
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
      DATABASE_RESET_ALLOWED: preview
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check preview database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL_PREVIEW secret is not set; skipping the integration job until the owner adds it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset the preview project's schema
        if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @feudo/web db:reset-schema

      - name: Migrate the preview project
        if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @feudo/web db:migrate

      - name: Integration tests
        if: steps.check.outputs.ready == 'true'
        run: pnpm test:integration
